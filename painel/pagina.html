<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reação da Torcida — Estúdio</title>
  <style>
    :root {
      color-scheme: dark;
      --fundo: #0f1115;
      --caixa: #171a21;
      --caixa-2: #1e222c;
      --linha: #242833;
      --texto: #e7e9ee;
      --fraco: #8b93a7;
      --viva: #35d07f;
      --morta: #ff5c5c;
      --alerta: #ffb020;
      --info: #63a9ff;
      --gol: #e5342b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 80% -10%, #17304a 0, transparent 34%), var(--fundo);
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    header, main { width: min(1400px, calc(100% - 32px)); margin-inline: auto; }
    header { padding: 42px 0 26px; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .sobretitulo { color: var(--info); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 5vw, 54px); line-height: .98; margin: 8px 0 0; letter-spacing: -.04em; }
    #resumo { color: var(--fraco); text-align: right; font-variant-numeric: tabular-nums; }
    #gols { display: grid; gap: 28px; }
    .gol { background: color-mix(in srgb, var(--caixa) 92%, transparent); border: 1px solid var(--linha); border-radius: 18px; padding: 20px; box-shadow: 0 18px 50px #0005; }
    .gol-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h2 { margin: 0; font-size: 22px; }
    .horario { color: var(--fraco); font-size: 13px; }
    .canais { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; }
    .clipe { border: 1px solid var(--linha); background: var(--caixa-2); border-radius: 14px; padding: 10px; transition: border-color .18s, opacity .18s, transform .18s; }
    .clipe:hover { transform: translateY(-2px); }
    .clipe.escolhido { border-color: var(--viva); }
    .clipe.descartado { opacity: .58; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 9px; display: block; }
    .meta { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 10px 2px 8px; }
    .nome { font-weight: 750; overflow-wrap: anywhere; }
    .sinal { color: var(--fraco); font-size: 12px; white-space: nowrap; }
    .sinal.pico { color: var(--viva); }
    .nota { min-height: 32px; color: var(--alerta); font-size: 12px; line-height: 1.35; margin: 0 2px 10px; }
    .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
    .filtros button { padding: 7px 14px; font-weight: 600; opacity: .55; }
    .filtros button.ativo { opacity: 1; outline: 2px solid currentColor; }
    .torcida { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
               font-weight: 800; padding: 2px 8px; border-radius: 999px;
               background: rgba(255,255,255,.14); }
    .forte { font-weight: 800; }
    .duracao { font-size: 11px; color: #8b93a7; font-weight: 600; letter-spacing: .4px; }
    .duracao.aparar { color: #ffb020; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; font: inherit; font-weight: 800; cursor: pointer; transition: filter .15s, transform .15s; }
    button:hover { filter: brightness(1.12); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: wait; }
    .sim { background: var(--viva); color: #062416; }
    .nao { background: #344353; color: var(--texto); }
    footer { position: sticky; bottom: 0; margin-top: 28px; padding: 16px 0 24px; background: linear-gradient(transparent, var(--fundo) 32%); display: flex; align-items: center; gap: 16px; }
    #montar { background: var(--alerta); color: #2b2100; padding: 13px 22px; }
    #recado { color: var(--fraco); margin: 0; overflow-wrap: anywhere; }
    .vazio { border: 1px dashed var(--linha); border-radius: 16px; padding: 50px 20px; text-align: center; color: var(--fraco); }
    @media (max-width: 700px) {
      header { align-items: start; flex-direction: column; }
      #resumo { text-align: left; }
      .gol { padding: 14px; }
      footer { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="sobretitulo">Curadoria local</div>
      <h1>Reação da Torcida</h1>
    </div>
    <div id="resumo">Carregando catálogo…</div>
    <div id="filtros" class="filtros"></div>
  </header>
  <main>
    <div id="gols"></div>
    <footer>
      <button id="montar" type="button">MONTAR COMPILAÇÃO</button>
      <p id="recado" role="status" aria-live="polite"></p>
    </footer>
  </main>
  <script>
    const alvo = document.getElementById('gols');
    const resumo = document.getElementById('resumo');
    const recado = document.getElementById('recado');

    function enderecoMidia(caminho) {
      return '/midia/' + caminho.split('/').map(encodeURIComponent).join('/');
    }

    function elemento(tag, classe, texto) {
      const no = document.createElement(tag);
      if (classe) no.className = classe;
      if (texto !== undefined) no.textContent = texto;
      return no;
    }

    async function escolher(gol, canal, escolhido, botoes) {
      botoes.forEach(botao => botao.disabled = true);
      const resposta = await fetch('/api/escolha', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({gol, canal, escolhido})
      });
      if (!resposta.ok) {
        const dados = await resposta.json();
        recado.textContent = dados.erro || 'Não foi possível salvar a escolha.';
      }
      await carregar();
    }

    function cartaoClipe(clipe) {
      const caixa = elemento('article', 'clipe');
      if (clipe.escolhido === true) caixa.classList.add('escolhido');
      if (clipe.escolhido === false) caixa.classList.add('descartado');

      const video = elemento('video');
      video.controls = true;
      video.preload = 'metadata';
      video.src = enderecoMidia(clipe.arquivo);
      caixa.appendChild(video);

      const meta = elemento('div', 'meta');
      const nome = elemento('div', 'nome', clipe.canal);
      if (clipe.torcida) nome.appendChild(elemento('span', 'torcida', ' ' + clipe.torcida));
      meta.appendChild(nome);
      if (clipe.duracao) {
        const etiqueta = elemento(
          'span', 'duracao' + (clipe.largo ? ' aparar' : ''),
          ` ${Math.round(clipe.duracao)}s`
        );
        nome.appendChild(etiqueta);
      }
      const forca = Number(clipe.confianca_db) || 0;
      const sinal = elemento(
        'div',
        'sinal' + (clipe.tem_pico ? ' pico forte' : ''),
        forca ? `${forca.toFixed(1)} dB` : 'sem medida'
      );
      meta.appendChild(sinal);
      caixa.appendChild(meta);

      const recados = [];
      if (clipe.largo) recados.push(
        'Janela larga: este canal ainda não tem alinhamento medido, então o clipe ' +
        'veio com folga. A reação está aqui dentro — apare no seu editor.'
      );
      if (clipe.parcial) recados.push(
        'Parcial: a gravação deste canal não cobria a janela inteira. Veio o que existia.'
      );
      if (!clipe.tem_pico && !recados.length) recados.push(
        'Reação fraca neste canal: o áudio quase não subiu.'
      );
      caixa.appendChild(elemento('p', 'nota', recados.join(' ')));

      const acoes = elemento('div', 'acoes');
      const usar = elemento('button', 'sim', '✓ Usar');
      const descartar = elemento('button', 'nao', '× Descartar');
      usar.type = descartar.type = 'button';
      usar.setAttribute('aria-label', `Usar clipe de ${clipe.canal}`);
      descartar.setAttribute('aria-label', `Descartar clipe de ${clipe.canal}`);
      const botoes = [usar, descartar];
      usar.onclick = () => escolher(clipe.gol, clipe.canal, true, botoes);
      descartar.onclick = () => escolher(clipe.gol, clipe.canal, false, botoes);
      acoes.append(usar, descartar);
      caixa.appendChild(acoes);
      return caixa;
    }

    let torcidaEscolhida = '';

    function desenharFiltros(clipes) {
      const caixa = document.getElementById('filtros');
      const torcidas = [...new Set(clipes.map(c => c.torcida || 'neutro'))].sort();
      caixa.replaceChildren();
      if (torcidas.length < 2) return;  // filtro de um valor so nao filtra nada
      [['', 'todos'], ...torcidas.map(t => [t, t])].forEach(([valor, rotulo]) => {
        const b = elemento('button', torcidaEscolhida === valor ? 'ativo' : '', rotulo);
        b.type = 'button';
        b.onclick = () => { torcidaEscolhida = valor; carregar(); };
        caixa.appendChild(b);
      });
    }

    async function carregar() {
      const resposta = await fetch('/api/catalogo');
      const dados = await resposta.json();
      alvo.replaceChildren();
      const escolhidos = dados.clipes.filter(c => c.escolhido === true).length;
      resumo.textContent = `${dados.clipes.length} clipes · ${escolhidos} escolhidos`;
      desenharFiltros(dados.clipes);

      if (!dados.gols.length) {
        alvo.appendChild(elemento('div', 'vazio', 'Nenhum gol registrado neste jogo.'));
        return;
      }

      for (const gol of dados.gols) {
        const bloco = elemento('section', 'gol');
        const topo = elemento('div', 'gol-topo');
        topo.appendChild(elemento('h2', '', `Gol ${gol.numero}${gol.descricao ? ' — ' + gol.descricao : ''}`));
        topo.appendChild(elemento('div', 'horario', gol.horario || 'horário não informado'));
        bloco.appendChild(topo);
        const linha = elemento('div', 'canais');
        // Mais explosivo primeiro: com onze canais por gol, ver na ordem certa
        // e o que poupa a maior parte do trabalho.
        dados.clipes
          .filter(c => c.gol === gol.numero)
          .filter(c => torcidaEscolhida === '' || (c.torcida || 'neutro') === torcidaEscolhida)
          .sort((a, b) => (Number(b.confianca_db) || 0) - (Number(a.confianca_db) || 0))
          .forEach(c => linha.appendChild(cartaoClipe(c)));
        bloco.appendChild(linha);
        alvo.appendChild(bloco);
      }
    }

    document.getElementById('montar').onclick = async event => {
      event.currentTarget.disabled = true;
      recado.textContent = 'Montando a compilação…';
      const resposta = await fetch('/api/montar', {method: 'POST'});
      const dados = await resposta.json();
      recado.textContent = dados.erro || `Pronto: ${dados.arquivo}`;
      event.currentTarget.disabled = false;
    };

    carregar().catch(erro => {
      recado.textContent = `Falha ao carregar o catálogo: ${erro.message}`;
    });
  </script>
</body>
</html>
