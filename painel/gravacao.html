<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reação da Torcida — gravação</title>
<style>
  :root {
    --fundo: #0f1115;
    --caixa: #171a21;
    --linha: #242833;
    --texto: #e7e9ee;
    --fraco: #8b93a7;
    --viva: #35d07f;
    --morta: #ff5c5c;
    --alerta: #ffb020;
    --gol: #e5342b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .3px; }
  .aviso { color: var(--fraco); font-size: 13px; margin-bottom: 20px; }
  .resumo {
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 22px;
  }
  .rotulo { color: var(--fraco); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; display: block; }
  .numero { font-size: 24px; font-weight: 600; display: block; }
  .atraso { margin-left: auto; }
  .atraso input {
    width: 74px; background: var(--fundo); color: var(--texto);
    border: 1px solid var(--linha); border-radius: 7px; padding: 7px 9px;
    font: inherit; text-align: right;
  }
  .jogo { margin-bottom: 30px; }
  .jogo h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .placar { color: var(--fraco); font-weight: 400; font-size: 14px; }
  .barra-gol { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 9px; padding: 10px 16px; font: inherit;
    font-weight: 700; cursor: pointer; color: #fff; background: var(--linha);
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translateY(1px); }
  .marcar {
    background: var(--gol); font-size: 17px; padding: 15px 26px;
    letter-spacing: .4px; box-shadow: 0 3px 0 #8f1f19;
  }
  .marcar:active { box-shadow: 0 1px 0 #8f1f19; }
  .marcar kbd {
    background: rgba(255,255,255,.22); border-radius: 5px;
    padding: 1px 7px; margin-left: 10px; font: 600 13px/1 "Segoe UI", sans-serif;
  }
  .marcas { display: flex; gap: 8px; flex-wrap: wrap; }
  .marca {
    display: flex; align-items: center; gap: 6px;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 9px; padding: 6px 8px 6px 12px;
  }
  .marca b { font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .marca .n { color: var(--fraco); font-size: 12px; }
  .marca button { padding: 3px 8px; font-size: 12px; font-weight: 600; background: #222735; }
  .marca button.x { background: #3a1f22; color: #ff8b8b; }
  table { width: 100%; border-collapse: collapse; background: var(--caixa);
          border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--linha); }
  th { color: var(--fraco); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bola { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .viva .bola { background: var(--viva); box-shadow: 0 0 8px var(--viva); }
  .morta .bola { background: var(--morta); }
  .morta td { color: var(--morta); }
  .morta .canal { font-weight: 600; }
  .sessoes-muitas { color: var(--alerta); }
  .vazio { color: var(--fraco); padding: 18px; }
  .quadros { display: grid; gap: 12px; margin-bottom: 12px;
             grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .quadro { background: var(--caixa); border: 1px solid var(--linha);
            border-radius: 10px; overflow: hidden; position: relative; }
  .quadro img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover;
                background: #000; }
  .quadro.morto img { filter: grayscale(1) brightness(.45); }
  .quadro figcaption { padding: 7px 10px; font-size: 12px; display: flex;
                       align-items: center; gap: 7px; }
  .quadro .bola { margin: 0; flex: none; }
  .quadro .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desloca { display: flex; align-items: center; gap: 4px; padding: 0 10px 8px; }
  .desloca input {
    width: 62px; background: var(--fundo); color: var(--texto); font: inherit;
    border: 1px solid var(--linha); border-radius: 6px; padding: 4px 6px;
    font-size: 12px; text-align: right;
  }
  .desloca span { color: var(--fraco); font-size: 11px; }
  .desloca .medido { color: var(--viva); }
  .alinhar { background: #1d3a52; font-size: 12px; padding: 6px 12px; }
  .alinhar:hover { background: #27506f; }
  .quadro img { cursor: zoom-in; }
  .parar { background: #5b1a1f; font-size: 13px; padding: 9px 16px; }
  .parar:hover { background: #7d2630; }
  #lupa {
    position: fixed; inset: 0; background: rgba(6,8,12,.93); display: none;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; z-index: 50; cursor: zoom-out; padding: 24px;
  }
  #lupa.aberta { display: flex; }
  #lupa img { max-width: min(1600px, 96vw); max-height: 86vh; border-radius: 10px;
              image-rendering: auto; }
  #lupa .legenda { color: var(--texto); font-weight: 600; letter-spacing: .3px; }
  #lupa .dica { color: var(--fraco); font-size: 13px; }
  #lupa .sincronizar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 10px; padding: 12px 16px; cursor: default;
  }
  #lupa .sincronizar input {
    width: 96px; background: var(--fundo); color: var(--texto); font: inherit;
    border: 1px solid var(--linha); border-radius: 7px; padding: 7px 9px;
    text-align: center; letter-spacing: 1px;
  }
  #lupa .sincronizar select {
    background: var(--fundo); color: var(--texto); font: inherit;
    border: 1px solid var(--linha); border-radius: 7px; padding: 7px;
  }
  #lupa .espn { color: var(--viva); font-weight: 700; font-variant-numeric: tabular-nums; }
  #lupa .sem-espn { color: var(--alerta); font-size: 13px; }
  #recado {
    position: fixed; right: 20px; bottom: 20px; background: var(--gol);
    color: #fff; font-weight: 700; padding: 13px 20px; border-radius: 10px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #recado.aparece { opacity: 1; pointer-events: auto; }
  #recado .desfazer {
    margin-left: 14px; background: rgba(0,0,0,.35); padding: 5px 12px;
    font-size: 13px; font-weight: 700;
  }
  #alarme {
    display: none; align-items: center; gap: 14px; flex-wrap: wrap;
    background: #3a1116; border: 1px solid #7d2630; color: #ffc9c9;
    border-radius: 10px; padding: 13px 18px; margin-bottom: 18px;
    font-weight: 600;
  }
  #alarme.aceso { display: flex; animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 50% { border-color: #ff5c5c; } }
  #alarme button { background: #7d2630; padding: 6px 12px; font-size: 13px; }
  #alarme .quem { font-weight: 400; color: #ff9b9b; }
</style>
</head>
<body>
<h1>Reação da Torcida — gravação</h1>
<p class="aviso">Esta página só lê o disco e anota gols. Fechar aqui <strong>não para a gravação</strong>. Atualiza sozinha a cada 3 segundos.</p>

<div class="resumo">
  <div><span class="rotulo">Gravando</span><span class="numero" id="r-gravando">—</span></div>
  <div><span class="rotulo">No disco</span><span class="numero" id="r-mb">—</span></div>
  <div><span class="rotulo">Jogos</span><span class="numero" id="r-jogos">—</span></div>
  <div><span class="rotulo">Atualizado</span><span class="numero" id="r-hora">—</span></div>
  <div class="atraso">
    <label class="rotulo" for="atraso">Atraso da sua tela (s)</label>
    <input id="atraso" type="number" value="0" step="1" min="-120" max="120"
           title="Se você assiste por uma fonte adiantada em relação ao YouTube, ponha aqui a diferença em segundos.">
  </div>
</div>

<div id="alarme">
  <span id="alarme-texto"></span>
  <span class="quem" id="alarme-quem"></span>
  <button type="button" id="calar">calar o som</button>
</div>

<div id="jogos"></div>

<div id="lupa">
  <img id="lupa-img" alt="">
  <div class="legenda" id="lupa-nome"></div>
  <div class="sincronizar" id="lupa-sync">
    <span>Cronômetro nesta tela:</span>
    <select id="lupa-tempo">
      <option value="1">1º tempo</option>
      <option value="2" selected>2º tempo</option>
    </select>
    <input id="lupa-relogio" placeholder="35:22" autocomplete="off">
    <button type="button" id="lupa-usar">sincronizar</button>
    <span id="lupa-espn"></span>
  </div>
  <div class="dica">Clique no fundo para fechar · ← → troca de canal</div>
</div>
<div id="recado"></div>

<script>
const alvo = document.getElementById('jogos');
const campoAtraso = document.getElementById('atraso');
const recado = document.getElementById('recado');
let ultimoEstado = null;

campoAtraso.value = localStorage.getItem('atraso') || '0';
campoAtraso.addEventListener('change', () => localStorage.setItem('atraso', campoAtraso.value));

const alarme = document.getElementById('alarme');
const botaoCalar = document.getElementById('calar');
let vivosAntes = null;
let comSom = true;
botaoCalar.addEventListener('click', () => {
  comSom = !comSom;
  botaoCalar.textContent = comSom ? 'calar o som' : 'som desligado';
});

function apitar() {
  if (!comSom) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.42].forEach(atraso => {
      const osc = ctx.createOscillator(), vol = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 660;
      vol.gain.setValueAtTime(0.0001, ctx.currentTime + atraso);
      vol.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + atraso + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + atraso + 0.3);
      osc.connect(vol).connect(ctx.destination);
      osc.start(ctx.currentTime + atraso);
      osc.stop(ctx.currentTime + atraso + 0.32);
    });
    setTimeout(() => ctx.close(), 1400);
  } catch (e) { /* som e um extra: nunca pode quebrar a pagina */ }
}

function vigiarQuedas(d) {
  const agora = new Map();
  d.jogos.forEach(j => j.canais.forEach(c => agora.set(j.jogo + '/' + c.canal, c.gravando)));

  const caidos = [...agora].filter(([, vivo]) => !vivo).map(([chave]) => chave.split('/')[1]);
  if (caidos.length) {
    alarme.classList.add('aceso');
    document.getElementById('alarme-texto').textContent =
      caidos.length === 1 ? '1 canal parou de gravar' : `${caidos.length} canais pararam de gravar`;
    document.getElementById('alarme-quem').textContent = caidos.join(' · ');
    document.title = `(${caidos.length}) parou — Reação da Torcida`;
  } else {
    alarme.classList.remove('aceso');
    document.title = 'Reação da Torcida — gravação';
  }

  if (vivosAntes) {
    const novoscaidos = [...agora].some(([chave, vivo]) => !vivo && vivosAntes.get(chave) === true);
    if (novoscaidos) apitar();
  }
  vivosAntes = agora;
}

function mb(v) { return v >= 1000 ? (v / 1000).toFixed(1) + ' GB' : Math.round(v) + ' MB'; }

function silencio(c) {
  if (c.gravando) return 'gravando';
  if (c.silencio < 0) return 'sem nada no disco';
  const s = c.silencio;
  return s < 120 ? `PAROU há ${s}s` : `PAROU há ${Math.floor(s / 60)} min`;
}

function avisar(texto, desfazer) {
  recado.replaceChildren(document.createTextNode(texto));
  if (desfazer) {
    // O 1 e o 2 marcam gol direto, o que e o certo no meio do jogo - mas
    // basta clicar na pagina e digitar para marcar sem querer. Ja aconteceu
    // duas vezes numa noite; o desfazer resolve sem tirar a pressa.
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'desfazer';
    b.textContent = 'desfazer';
    b.onclick = () => { desfazer(); recado.classList.remove('aparece'); };
    recado.appendChild(b);
  }
  recado.classList.add('aparece');
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => recado.classList.remove('aparece'), desfazer ? 9000 : 2600);
}

async function enviar(rota, corpo) {
  const r = await fetch(rota, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(corpo)
  });
  const d = await r.json();
  if (!r.ok) { avisar(d.erro || 'não deu certo'); return null; }
  await atualizar();
  return d;
}

async function marcarGol(jogo) {
  const d = await enviar('/api/marcar', {jogo, atraso: Number(campoAtraso.value) || 0});
  if (d) {
    avisar(
      `GOL ${d.numero} anotado às ${d.horario}`,
      () => enviar('/api/apagar', {jogo, numero: d.numero}),
    );
  }
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const i = Number(e.key) - 1;
  if (ultimoEstado && ultimoEstado.jogos[i]) marcarGol(ultimoEstado.jogos[i].jogo);
});

async function atualizar() {
  let d;
  try {
    d = await (await fetch('/api/estado', {cache: 'no-store'})).json();
  } catch (e) {
    document.getElementById('r-hora').textContent = 'sem resposta';
    return;
  }
  ultimoEstado = d;
  vigiarQuedas(d);
  document.getElementById('r-gravando').textContent = d.gravando + ' / ' + d.total;
  document.getElementById('r-mb').textContent = mb(d.mb);
  document.getElementById('r-jogos').textContent = d.jogos.length;
  document.getElementById('r-hora').textContent = d.hora;

  if (!d.jogos.length) {
    alvo.innerHTML = '<p class="vazio">Nenhuma gravação encontrada ainda.</p>';
    return;
  }

  // As imagens so trocam a cada 15s: o quadro vale esse tempo do lado do servidor,
  // e pedir a cada 3s so faria o navegador buscar de novo a mesma foto.
  const selo = Math.floor(Date.now() / 15000);

  alvo.innerHTML = d.jogos.map((j, i) => {
    const linhas = j.canais.slice().sort((a, b) =>
      (b.gravando - a.gravando) || (b.mb - a.mb)
    ).map(c => `
      <tr class="${c.gravando ? 'viva' : 'morta'}">
        <td class="canal"><span class="bola"></span>${c.canal}</td>
        <td class="num">${mb(c.mb)}</td>
        <td class="num ${c.sessoes > 3 ? 'sessoes-muitas' : ''}">${c.sessoes}</td>
        <td>${silencio(c)}</td>
      </tr>`).join('');

    const quadros = j.canais.slice().sort((a, b) =>
      (b.gravando - a.gravando) || a.canal.localeCompare(b.canal)
    ).map(c => `
      <figure class="quadro ${c.gravando ? 'viva' : 'morta'}">
        <img loading="lazy" alt="${c.canal}" data-jogo="${j.jogo}" data-canal="${c.canal}"
             title="Clique para ver grande e ler o relógio do jogo"
             src="/api/quadro?jogo=${encodeURIComponent(j.jogo)}&canal=${encodeURIComponent(c.canal)}&v=${selo}">
        <figcaption><span class="bola"></span><span class="nome">${c.canal}</span></figcaption>
        <div class="desloca">
          <input type="number" step="0.5" value="${c.deslocamento ?? ''}" placeholder="0"
                 data-jogo="${j.jogo}" data-canal="${c.canal}"
                 title="Segundos que este canal está atrasado em relação aos outros. Positivo = mostra o lance depois.">
          <span class="${c.deslocamento == null ? '' : 'medido'}">s de atraso</span>
        </div>
      </figure>`).join('');

    const marcas = (j.gols || []).map(g => `
      <span class="marca">
        <span class="n">#${g.numero}</span><b>${g.horario}</b>
        <button data-acao="mover" data-jogo="${j.jogo}" data-n="${g.numero}" data-s="-5">−5s</button>
        <button data-acao="mover" data-jogo="${j.jogo}" data-n="${g.numero}" data-s="5">+5s</button>
        <button class="alinhar" data-acao="alinhar" data-jogo="${j.jogo}" data-n="${g.numero}"
                title="Mede o atraso de cada canal pelo grito deste gol">⇔ alinhar</button>
        <button class="x" data-acao="apagar" data-jogo="${j.jogo}" data-n="${g.numero}">×</button>
      </span>`).join('') || '<span class="placar">nenhum gol anotado ainda</span>';

    return `
      <div class="jogo">
        <h2>${j.jogo} <span class="placar">${j.gravando} de ${j.total} gravando · ${mb(j.mb)}</span></h2>
        <div class="barra-gol">
          <button class="marcar" data-acao="marcar" data-jogo="${j.jogo}">⚽ MARCAR GOL AGORA <kbd>${i + 1}</kbd></button>
          <div class="marcas">${marcas}</div>
          <button class="parar" data-acao="parar" data-jogo="${j.jogo}">■ PARAR ESTE JOGO</button>
        </div>
        <div class="quadros">${quadros}</div>
        <table>
          <thead><tr><th>Canal</th><th class="num">Gravado</th><th class="num">Sessões</th><th>Situação</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');
}

const lupa = document.getElementById('lupa');
const lupaImg = document.getElementById('lupa-img');
const lupaNome = document.getElementById('lupa-nome');
let lupaLista = [], lupaIndice = 0;

function abrirLupa(jogo, canal) {
  // Do jogo inteiro, para as setas percorrerem os canais daquela partida.
  const j = (ultimoEstado?.jogos || []).find(x => x.jogo === jogo);
  lupaLista = j ? j.canais.map(c => ({jogo, canal: c.canal})) : [{jogo, canal}];
  lupaIndice = Math.max(0, lupaLista.findIndex(x => x.canal === canal));
  mostrarLupa();
  lupa.classList.add('aberta');
}

const lupaEspn = document.getElementById('lupa-espn');
const lupaRelogio = document.getElementById('lupa-relogio');
const lupaTempo = document.getElementById('lupa-tempo');
let instanteDoQuadro = null;

function comoRelogio(segundos) {
  if (segundos == null) return '—';
  const s = Math.max(0, Math.round(segundos));
  const metade = s >= 2700 ? '2T' : '1T';
  const dentro = s >= 2700 ? s - 2700 : s;
  return `${metade} ${String(Math.floor(dentro / 60)).padStart(2, '0')}:${String(dentro % 60).padStart(2, '0')}`;
}

async function mostrarLupa() {
  const alvoLupa = lupaLista[lupaIndice];
  if (!alvoLupa) return;
  lupaNome.textContent = `${alvoLupa.canal}  (${lupaIndice + 1} de ${lupaLista.length})`;
  lupaEspn.textContent = '';
  instanteDoQuadro = null;

  // Sem selo de tempo: aqui a foto tem que ser a mais nova possivel, porque e
  // com ela que se le o relogio do jogo para medir o atraso do canal.
  const endereco = `/api/quadro?jogo=${encodeURIComponent(alvoLupa.jogo)}&canal=${encodeURIComponent(alvoLupa.canal)}&v=${Date.now()}`;
  try {
    const r = await fetch(endereco, {cache: 'no-store'});
    if (!r.ok) throw new Error('sem quadro');
    // O instante do quadro vem no cabecalho: e contra ele que o cronometro
    // da tela sera comparado com o da ESPN, que nao para de andar.
    instanteDoQuadro = r.headers.get('X-Instante');
    lupaImg.src = URL.createObjectURL(await r.blob());
  } catch (e) {
    lupaImg.removeAttribute('src');
  }

  const jogo = (ultimoEstado?.jogos || []).find(x => x.jogo === alvoLupa.jogo);
  const espn = jogo?.espn;
  if (!espn || espn.segundo_de_jogo == null) {
    lupaEspn.className = 'sem-espn';
    lupaEspn.textContent = 'ESPN sem cronômetro para este jogo — use o campo de atraso';
    return;
  }
  let noQuadro = espn.segundo_de_jogo;
  if (instanteDoQuadro) {
    noQuadro -= (new Date(espn.lido_em) - new Date(instanteDoQuadro)) / 1000;
  }
  lupaEspn.className = 'espn';
  lupaEspn.textContent = `ESPN neste instante: ${comoRelogio(noQuadro)}`;
  lupaTempo.value = noQuadro >= 2700 ? '2' : '1';
}

async function sincronizarCanal() {
  const alvoLupa = lupaLista[lupaIndice];
  if (!alvoLupa || !instanteDoQuadro) { avisar('sem quadro para comparar'); return; }
  const d = await enviar('/api/cronometrar', {
    jogo: alvoLupa.jogo, canal: alvoLupa.canal,
    relogio: lupaRelogio.value, tempo: Number(lupaTempo.value),
    instante: instanteDoQuadro,
  });
  if (d && d.ok) {
    avisar(`${d.canal}: ${d.deslocamento > 0 ? 'atrasado' : 'adiantado'} ${Math.abs(d.deslocamento)}s`);
    lupaRelogio.value = '';
  }
}

lupa.addEventListener('click', (e) => {
  // Fechar so no fundo: clicar no campo de sincronizar nao pode fechar a tela.
  if (e.target === lupa || e.target === lupaImg) lupa.classList.remove('aberta');
});
document.getElementById('lupa-usar').addEventListener('click', sincronizarCanal);
lupaRelogio.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sincronizarCanal();
  e.stopPropagation();  // as setas aqui movem o cursor, nao o canal
});
document.addEventListener('keydown', (e) => {
  if (!lupa.classList.contains('aberta')) return;
  if (e.key === 'Escape') lupa.classList.remove('aberta');
  if (e.key === 'ArrowRight') { lupaIndice = (lupaIndice + 1) % lupaLista.length; mostrarLupa(); }
  if (e.key === 'ArrowLeft') { lupaIndice = (lupaIndice - 1 + lupaLista.length) % lupaLista.length; mostrarLupa(); }
});

alvo.addEventListener('change', async (e) => {
  const campo = e.target.closest('.desloca input');
  if (!campo) return;
  const segundos = Number(campo.value);
  if (Number.isNaN(segundos)) return;
  const d = await enviar('/api/ajustar', {
    jogo: campo.dataset.jogo, canal: campo.dataset.canal, segundos,
  });
  if (d) avisar(`${d.canal}: atraso ajustado para ${d.deslocamento}s`);
});

alvo.addEventListener('click', async (e) => {
  const foto = e.target.closest('.quadro img');
  if (foto) { abrirLupa(foto.dataset.jogo, foto.dataset.canal); return; }

  const b = e.target.closest('button');
  if (!b) return;
  const {acao, jogo, n, s} = b.dataset;
  if (acao === 'marcar') marcarGol(jogo);
  if (acao === 'mover') enviar('/api/mover', {jogo, numero: Number(n), segundos: Number(s)});
  if (acao === 'apagar') enviar('/api/apagar', {jogo, numero: Number(n)});
  if (acao === 'alinhar') {
    b.disabled = true;
    avisar('medindo o atraso de cada canal...');
    const d = await enviar('/api/alinhar', {jogo, numero: Number(n)});
    b.disabled = false;
    if (d && d.ok) {
      const quantos = Object.keys(d.deslocamentos).length;
      avisar(d.confiavel
        ? `${quantos} canais alinhados (espalhamento ${d.espalhamento}s)`
        : `alinhado, mas CONFIRA: os canais discordaram em ${d.espalhamento}s`);
    } else if (d) {
      avisar(d.motivo || 'não deu para alinhar');
    }
  }
  if (acao === 'parar') {
    // Irreversivel no meio do jogo: um clique sem querer nao pode custar o resto.
    if (!confirm(`PARAR a gravação de "${jogo}"?

O que já foi gravado continua no disco, mas daqui em diante nada mais é gravado.`)) return;
    const d = await enviar('/api/parar', {jogo});
    if (d) avisar(`gravação parada (${d.derrubados} processo(s))`);
  }
});

atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
