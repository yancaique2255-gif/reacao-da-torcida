<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reação da Torcida — gravação</title>
<style>
  :root {
    --fundo: #0f1115;
    --caixa: #171a21;
    --linha: #242833;
    --texto: #e7e9ee;
    --fraco: #8b93a7;
    --viva: #35d07f;
    --morta: #ff5c5c;
    --alerta: #ffb020;
    --gol: #e5342b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .3px; }
  .aviso { color: var(--fraco); font-size: 13px; margin-bottom: 20px; }
  .resumo {
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 22px;
  }
  .rotulo { color: var(--fraco); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; display: block; }
  .numero { font-size: 24px; font-weight: 600; display: block; }
  .atraso { margin-left: auto; }
  .atraso input {
    width: 74px; background: var(--fundo); color: var(--texto);
    border: 1px solid var(--linha); border-radius: 7px; padding: 7px 9px;
    font: inherit; text-align: right;
  }
  .jogo { margin-bottom: 30px; }
  .jogo h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .placar { color: var(--fraco); font-weight: 400; font-size: 14px; }
  .barra-gol { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 9px; padding: 10px 16px; font: inherit;
    font-weight: 700; cursor: pointer; color: #fff; background: var(--linha);
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translateY(1px); }
  .marcar {
    background: var(--gol); font-size: 17px; padding: 15px 26px;
    letter-spacing: .4px; box-shadow: 0 3px 0 #8f1f19;
  }
  .marcar:active { box-shadow: 0 1px 0 #8f1f19; }
  .marcar kbd {
    background: rgba(255,255,255,.22); border-radius: 5px;
    padding: 1px 7px; margin-left: 10px; font: 600 13px/1 "Segoe UI", sans-serif;
  }
  .marcas { display: flex; gap: 8px; flex-wrap: wrap; }
  .marca {
    display: flex; align-items: center; gap: 6px;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 9px; padding: 6px 8px 6px 12px;
  }
  .marca b { font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .marca .n { color: var(--fraco); font-size: 12px; }
  .marca button { padding: 3px 8px; font-size: 12px; font-weight: 600; background: #222735; }
  .marca button.x { background: #3a1f22; color: #ff8b8b; }
  table { width: 100%; border-collapse: collapse; background: var(--caixa);
          border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--linha); }
  th { color: var(--fraco); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bola { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .viva .bola { background: var(--viva); box-shadow: 0 0 8px var(--viva); }
  .morta .bola { background: var(--morta); }
  .morta td { color: var(--morta); }
  .morta .canal { font-weight: 600; }
  .sessoes-muitas { color: var(--alerta); }
  .vazio { color: var(--fraco); padding: 18px; }
  #recado {
    position: fixed; right: 20px; bottom: 20px; background: var(--gol);
    color: #fff; font-weight: 700; padding: 13px 20px; border-radius: 10px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #recado.aparece { opacity: 1; }
  #alarme {
    display: none; align-items: center; gap: 14px; flex-wrap: wrap;
    background: #3a1116; border: 1px solid #7d2630; color: #ffc9c9;
    border-radius: 10px; padding: 13px 18px; margin-bottom: 18px;
    font-weight: 600;
  }
  #alarme.aceso { display: flex; animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 50% { border-color: #ff5c5c; } }
  #alarme button { background: #7d2630; padding: 6px 12px; font-size: 13px; }
  #alarme .quem { font-weight: 400; color: #ff9b9b; }
</style>
</head>
<body>
<h1>Reação da Torcida — gravação</h1>
<p class="aviso">Esta página só lê o disco e anota gols. Fechar aqui <strong>não para a gravação</strong>. Atualiza sozinha a cada 3 segundos.</p>

<div class="resumo">
  <div><span class="rotulo">Gravando</span><span class="numero" id="r-gravando">—</span></div>
  <div><span class="rotulo">No disco</span><span class="numero" id="r-mb">—</span></div>
  <div><span class="rotulo">Jogos</span><span class="numero" id="r-jogos">—</span></div>
  <div><span class="rotulo">Atualizado</span><span class="numero" id="r-hora">—</span></div>
  <div class="atraso">
    <label class="rotulo" for="atraso">Atraso da sua tela (s)</label>
    <input id="atraso" type="number" value="0" step="1" min="-120" max="120"
           title="Se você assiste por uma fonte adiantada em relação ao YouTube, ponha aqui a diferença em segundos.">
  </div>
</div>

<div id="alarme">
  <span id="alarme-texto"></span>
  <span class="quem" id="alarme-quem"></span>
  <button type="button" id="calar">calar o som</button>
</div>

<div id="jogos"></div>
<div id="recado"></div>

<script>
const alvo = document.getElementById('jogos');
const campoAtraso = document.getElementById('atraso');
const recado = document.getElementById('recado');
let ultimoEstado = null;

campoAtraso.value = localStorage.getItem('atraso') || '0';
campoAtraso.addEventListener('change', () => localStorage.setItem('atraso', campoAtraso.value));

const alarme = document.getElementById('alarme');
const botaoCalar = document.getElementById('calar');
let vivosAntes = null;
let comSom = true;
botaoCalar.addEventListener('click', () => {
  comSom = !comSom;
  botaoCalar.textContent = comSom ? 'calar o som' : 'som desligado';
});

function apitar() {
  if (!comSom) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.42].forEach(atraso => {
      const osc = ctx.createOscillator(), vol = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 660;
      vol.gain.setValueAtTime(0.0001, ctx.currentTime + atraso);
      vol.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + atraso + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + atraso + 0.3);
      osc.connect(vol).connect(ctx.destination);
      osc.start(ctx.currentTime + atraso);
      osc.stop(ctx.currentTime + atraso + 0.32);
    });
    setTimeout(() => ctx.close(), 1400);
  } catch (e) { /* som e um extra: nunca pode quebrar a pagina */ }
}

function vigiarQuedas(d) {
  const agora = new Map();
  d.jogos.forEach(j => j.canais.forEach(c => agora.set(j.jogo + '/' + c.canal, c.gravando)));

  const caidos = [...agora].filter(([, vivo]) => !vivo).map(([chave]) => chave.split('/')[1]);
  if (caidos.length) {
    alarme.classList.add('aceso');
    document.getElementById('alarme-texto').textContent =
      caidos.length === 1 ? '1 canal parou de gravar' : `${caidos.length} canais pararam de gravar`;
    document.getElementById('alarme-quem').textContent = caidos.join(' · ');
    document.title = `(${caidos.length}) parou — Reação da Torcida`;
  } else {
    alarme.classList.remove('aceso');
    document.title = 'Reação da Torcida — gravação';
  }

  if (vivosAntes) {
    const novoscaidos = [...agora].some(([chave, vivo]) => !vivo && vivosAntes.get(chave) === true);
    if (novoscaidos) apitar();
  }
  vivosAntes = agora;
}

function mb(v) { return v >= 1000 ? (v / 1000).toFixed(1) + ' GB' : Math.round(v) + ' MB'; }

function silencio(c) {
  if (c.gravando) return 'gravando';
  if (c.silencio < 0) return 'sem nada no disco';
  const s = c.silencio;
  return s < 120 ? `PAROU há ${s}s` : `PAROU há ${Math.floor(s / 60)} min`;
}

function avisar(texto) {
  recado.textContent = texto;
  recado.classList.add('aparece');
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => recado.classList.remove('aparece'), 2600);
}

async function enviar(rota, corpo) {
  const r = await fetch(rota, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(corpo)
  });
  const d = await r.json();
  if (!r.ok) { avisar(d.erro || 'não deu certo'); return null; }
  await atualizar();
  return d;
}

async function marcarGol(jogo) {
  const d = await enviar('/api/marcar', {jogo, atraso: Number(campoAtraso.value) || 0});
  if (d) avisar(`GOL ${d.numero} anotado às ${d.horario}`);
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const i = Number(e.key) - 1;
  if (ultimoEstado && ultimoEstado.jogos[i]) marcarGol(ultimoEstado.jogos[i].jogo);
});

async function atualizar() {
  let d;
  try {
    d = await (await fetch('/api/estado', {cache: 'no-store'})).json();
  } catch (e) {
    document.getElementById('r-hora').textContent = 'sem resposta';
    return;
  }
  ultimoEstado = d;
  vigiarQuedas(d);
  document.getElementById('r-gravando').textContent = d.gravando + ' / ' + d.total;
  document.getElementById('r-mb').textContent = mb(d.mb);
  document.getElementById('r-jogos').textContent = d.jogos.length;
  document.getElementById('r-hora').textContent = d.hora;

  if (!d.jogos.length) {
    alvo.innerHTML = '<p class="vazio">Nenhuma gravação encontrada ainda.</p>';
    return;
  }

  alvo.innerHTML = d.jogos.map((j, i) => {
    const linhas = j.canais.slice().sort((a, b) =>
      (b.gravando - a.gravando) || (b.mb - a.mb)
    ).map(c => `
      <tr class="${c.gravando ? 'viva' : 'morta'}">
        <td class="canal"><span class="bola"></span>${c.canal}</td>
        <td class="num">${mb(c.mb)}</td>
        <td class="num ${c.sessoes > 3 ? 'sessoes-muitas' : ''}">${c.sessoes}</td>
        <td>${silencio(c)}</td>
      </tr>`).join('');

    const marcas = (j.gols || []).map(g => `
      <span class="marca">
        <span class="n">#${g.numero}</span><b>${g.horario}</b>
        <button data-acao="mover" data-jogo="${j.jogo}" data-n="${g.numero}" data-s="-5">−5s</button>
        <button data-acao="mover" data-jogo="${j.jogo}" data-n="${g.numero}" data-s="5">+5s</button>
        <button class="x" data-acao="apagar" data-jogo="${j.jogo}" data-n="${g.numero}">×</button>
      </span>`).join('') || '<span class="placar">nenhum gol anotado ainda</span>';

    return `
      <div class="jogo">
        <h2>${j.jogo} <span class="placar">${j.gravando} de ${j.total} gravando · ${mb(j.mb)}</span></h2>
        <div class="barra-gol">
          <button class="marcar" data-acao="marcar" data-jogo="${j.jogo}">⚽ MARCAR GOL AGORA <kbd>${i + 1}</kbd></button>
          <div class="marcas">${marcas}</div>
        </div>
        <table>
          <thead><tr><th>Canal</th><th class="num">Gravado</th><th class="num">Sessões</th><th>Situação</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');
}

alvo.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const {acao, jogo, n, s} = b.dataset;
  if (acao === 'marcar') marcarGol(jogo);
  if (acao === 'mover') enviar('/api/mover', {jogo, numero: Number(n), segundos: Number(s)});
  if (acao === 'apagar') enviar('/api/apagar', {jogo, numero: Number(n)});
});

atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
